name: SonarQube Cloud

on:
  push:
    branches: [main]

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas y generar coverage.xml
        run: python -m pytest --cov=inventario --cov-report=xml

      - name: Análisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
